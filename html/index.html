<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RS Field Terminal Progress UI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body>
  <div id="app" class="nui-hidden">
    <div id="terminal-wrapper" class="terminal-wrapper" data-theme="default" data-position="center-bottom" aria-hidden="true">
      <div class="terminal-device">
        <div class="case-rivet rivet-a"></div><div class="case-rivet rivet-b"></div>
        <div class="case-rivet rivet-c"></div><div class="case-rivet rivet-d"></div>
        <div class="case-marking">RS FIELD TERMINAL</div>
        <div class="case-submark">FIELD SERIES // FT-04</div>
        <div class="case-controls" aria-hidden="true">
          <div class="control-slot"></div>
          <div class="control-knob"></div>
          <div class="control-led"></div>
          <div class="control-grille"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="terminal-screen">
          <div class="screen-fill"></div>
          <div class="screen-glow"></div>
          <div class="screen-scanlines"></div>

          <div class="screen-inner">
            <div class="terminal-meta-row">
              <span class="meta-left"><i class="meta-blip"></i>RS FIELD TERMINAL</span>
              <span class="meta-right" id="statusText">STATUS: ACTIVE</span>
            </div>

            <div class="task-block">
              <div id="taskLabel" class="task-label">WORKING...</div>
              <div id="taskStage" class="task-stage">Initializing process</div>
              <div class="task-divider"><span class="task-chevron"></span></div>
            </div>

            <div class="main-progress-row">
              <div class="progress-tube">
                <div id="progressFill" class="progress-fill"></div>
                <div class="tube-segments"></div>
              </div>
              <div class="readout readout--percent">
                <span id="percentValue">0</span><span class="unit unit--percent">%</span>
              </div>
              <div class="readout readout--timer">
                <span id="timeValue">00:00.0</span>
              </div>
            </div>

            <div class="telemetry-row">
              <div class="telemetry telemetry--left">
                <div class="telemetry-title">SIG</div>
                <div class="signal-box">
                  <svg class="signal-wave" viewBox="0 0 180 72" preserveAspectRatio="none" aria-hidden="true">
                    <polyline points="0,40 14,40 22,34 30,40 44,40 52,12 60,60 70,40 88,40 96,44 104,36 118,40 128,14 136,58 146,40 180,40"></polyline>
                  </svg>
                  <div class="signal-bars" aria-hidden="true">
                    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    <span class="bar bar--dim"></span><span class="bar bar--dim"></span>
                  </div>
                </div>
                <div class="sys-ok">SYS: OK</div>
              </div>

              <div class="telemetry telemetry--right">
                <div class="phase-row">
                  <div id="phaseValue" class="phase-value">PHASE 01 / 01</div>
                  <div id="stageNodes" class="stage-nodes"></div>
                </div>
                <div class="micro-dots"></div>
                <div class="footer-row">
                  <div id="cancelHint" class="cancel-hint">PRESS X TO CANCEL</div>
                  <div class="mini-buttons" aria-hidden="true">
                    <div class="mini-button"><span class="mini-button__label">PWR</span><span class="mini-button__lamp"></span></div>
                    <div class="mini-button"><span class="mini-button__label">DATA</span><span class="mini-button__lamp"></span></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="screen-ruler" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="rs-uiscale.js"></script>
  <script src="script.js"></script>
</body>
</html>
